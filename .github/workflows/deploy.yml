name: Deploy

on:
    push:
        branches: [main]

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/2026ganzi-thon/hanol-server

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ env.IMAGE }}:latest

    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USERNAME }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                      echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                      docker pull ${{ env.IMAGE }}:latest

                      docker stop hanol-server 2>/dev/null || true
                      docker rm -f hanol-server-old 2>/dev/null || true
                      docker rename hanol-server hanol-server-old 2>/dev/null || true

                      docker run -d --name hanol-server --network host --env-file ~/2026_GANZITHON_TEAM_26_BE/.env --restart unless-stopped ${{ env.IMAGE }}:latest

                      sleep 30
                      for i in {1..5}; do
                          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/actuator/health")
                          if [ "$STATUS" = "200" ]; then
                              echo "Health check passed"
                              docker rm -f hanol-server-old 2>/dev/null || true
                              docker image prune -f
                              exit 0
                          fi
                          echo "Attempt $i failed (status: $STATUS), retrying..."
                          sleep 10
                      done

                      echo "Health check failed, rolling back to previous container"
                      docker rm -f hanol-server 2>/dev/null || true
                      docker rename hanol-server-old hanol-server 2>/dev/null || true
                      docker start hanol-server 2>/dev/null || true
                      exit 1
