# ===== 공통 설정 =====
# 프로필: local(기본, 내 컴퓨터) / dev(개발 서버)
# 비밀값은 여기 직접 쓰지 않고 환경변수(${...})로 받는다. 로컬에서는 프로젝트 루트의 .env 파일에 적는다.

spring:
  application:
    name: hanol
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}] %X{method:-} %X{uri:-}"

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "1. API 명세 (설계용 YAML)"
        url: /docs/openapi.yaml
      - name: "2. 구현된 API (코드에서 자동 생성)"
        url: /v3/api-docs
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:1h}
    refresh-token-validity: ${JWT_REFRESH_TOKEN_VALIDITY:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}