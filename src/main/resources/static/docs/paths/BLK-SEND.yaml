cheerAvailability:
  get:
    tags: [BLK]
    operationId: BLK-SEND-001
    summary: 패치 보내기 가능 확인
    responses:
      "200":
        description: 작성 가능 여부와 질문 목록
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/CheerAvailabilityData"
      "401":
        description: 로그인하지 않은 상태로 접근
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/UnauthorizedError"

cheerSend:
  post:
    tags: [BLK]
    operationId: BLK-SEND-002
    summary: 패치 검사·발송
    description: >-
      1차 금칙어 필터·2차 AI 분류 결과 부적절로 판정되면 400으로 응답한다.
      위기 표현 감지는 예외가 아닌 정상 분기로, 200 응답 후 위기 안내 화면(ALRT-HELP-002)으로 안내한다.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/CheerSendRequest"
    responses:
      "200":
        description: 발송 완료(위기 표현 포함 여부와 무관하게 200)
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/CheerSendData"
      "401":
        description: 로그인하지 않은 상태로 접근
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/UnauthorizedError"
      "400":
        description: 본문 길이 0자 또는 50자 초과 / 대상 감정 미선택(Bean Validation) / 1차 금칙어 필터 또는 2차 AI 분류 부적절 판정(도메인 전용)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InvalidInputError"
            examples:
              invalidInput:
                summary: 본문 길이 0자 또는 50자 초과 / 대상 감정 미선택
                value: { code: 400_INVALID_INPUT, message: 입력값이 올바르지 않습니다. }
              harshLanguage:
                summary: 1차 금칙어 필터 또는 2차 AI 분류 — 거친 말(도메인 전용)
                value: { code: 400_CHEER_HARSH_LANGUAGE, message: 거친 말이 들어 있어요 }
              demeaning:
                summary: 1차 금칙어 필터 또는 2차 AI 분류 — 누군가를 낮추는 말(도메인 전용)
                value: { code: 400_CHEER_DEMEANING, message: 누군가를 낮추는 말이 있어요 }
              hurtful:
                summary: 2차 AI 분류 — 받는 사람을 다치게 할 수 있는 말(도메인 전용)
                value: { code: 400_CHEER_HURTFUL, message: 받는 사람을 다치게 할 수 있어요 }
              dismissive:
                summary: 2차 AI 분류 — 아픈 마음을 작게 만드는 말(도메인 전용)
                value: { code: 400_CHEER_DISMISSIVE, message: 아픈 마음을 작게 만드는 말이 있어요 }
              contactOrLink:
                summary: 연락처·링크 포함(도메인 전용)
                value: { code: 400_CHEER_CONTACT_OR_LINK, message: 연락처나 링크는 보낼 수 없어요 }
              offTopic:
                summary: 2차 AI 분류 — 패치와 맞지 않는 내용(도메인 전용)
                value: { code: 400_CHEER_OFF_TOPIC, message: 패치와 맞지 않는 내용이에요 }
      "403":
        description: 신고 누적으로 보내기 제한 중(BLK-RPT-002) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/CheerSendRestrictedError"
      "429":
        description: 쿨타임 중(발송 성공 후 5분) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/CheerCooldownError"
      "500":
        description: 서버 전송 실패(작성 내용 유지)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InternalServerError"

schemas:
  CheerAvailabilityData:
    type: object
    properties:
      sendable:
        type: boolean
        description: 지금 보낼 수 없으면 false
      restrictedUntil:
        type: string
        format: date-time
        nullable: true
        description: 보내기 제한(BLK-RPT-002)이 풀리는 시각. 제한 중이 아니면 null. 제한 중이면 questions 는 빈 배열
      cooldownUntil:
        type: string
        format: date-time
        nullable: true
        description: 패치 보내기 쿨타임(발송 성공 후 5분)이 끝나는 시각. 쿨타임 중이 아니면 null. 쿨타임 중이면 questions 는 빈 배열
      questions:
        type: array
        items:
          $ref: "#/schemas/EmotionQuestionGroup"

  EmotionQuestionGroup:
    type: object
    properties:
      emotion:
        type: string
        example: SAD
      questions:
        type: array
        items:
          type: string
        example: ["오늘 어떤 순간이 가장 힘들었나요?"]

  CheerSendRequest:
    type: object
    required: [targetEmotion, content]
    properties:
      targetEmotion:
        type: string
        example: SAD
      content:
        type: string
        minLength: 1
        maxLength: 50
        example: 오늘도 고생 많았어요.

  CheerSendData:
    type: object
    properties:
      crisisDetected:
        type: boolean
        description: true면 위기 안내 화면(ALRT-HELP-002)으로 안내한다.

  CheerSendRestrictedError:
    type: object
    properties:
      code:
        type: string
        example: 403_CHEER_SEND_RESTRICTED
      message:
        type: string
        example: 신고가 누적되어 지금은 패치를 보낼 수 없어요

  CheerCooldownError:
    type: object
    properties:
      code:
        type: string
        example: 429_CHEER_COOLDOWN
      message:
        type: string
        example: 패치는 5분에 한 번 보낼 수 있어요
