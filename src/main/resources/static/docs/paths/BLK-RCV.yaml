cheerReceive:
  post:
    tags: [BLK]
    operationId: BLK-RCV-001
    summary: 패치 받기
    description: >-
      오늘 1~3번째 기록으로 받는 도안은 대기열에서 패치를 꺼내 담요에 적립한다(BLK-STACK-001).
      오늘 4번째 이상 기록이면 대기열 조회 없이 도안별 기본 메시지만 내려주고 담요에는 적립하지 않는다(BLK-RCV-002).
    responses:
      "200":
        description: 도안별 패치 메시지
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/CheerReceiveData"
      "401":
        description: 로그인하지 않은 상태로 접근
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/UnauthorizedError"
      "400":
        description: 오늘 받기 가능한 기록 없음(마음 고르기 미완료) / 오늘 기록 자체가 없어 몇 번째인지 판단 불가
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/BadRequestError"
      "409":
        description: 이미 해당 기록으로 패치를 받은 상태에서 재요청
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/ConflictError"
      "500":
        description: 대기열 조회·적립 처리 실패
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InternalServerError"

schemas:
  CheerReceiveData:
    type: object
    properties:
      patches:
        type: array
        items:
          $ref: "#/schemas/ReceivedCheer"

  ReceivedCheer:
    type: object
    properties:
      cheerId:
        type: integer
        format: int64
        nullable: true
        description: 기본 메시지(isDefault true)면 null
      emotion:
        type: string
        example: SAD
      message:
        type: string
      isDefault:
        type: boolean
        description: 대기열이 비어 기본 메시지로 대체되었거나(1~3번째) 4번째 이상 기록이라 기본 메시지만 받은 경우 true
