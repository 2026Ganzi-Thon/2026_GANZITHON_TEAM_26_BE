signup:
  post:
    tags: [USR]
    operationId: USR-AUTH-001
    summary: 회원가입
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/SignupRequest"
    responses:
      "201":
        description: 회원가입 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 이메일 형식 불일치 / 비밀번호 8~20자 범위 밖 / 필수 동의 3개 중 미포함 항목 존재(도메인 전용) / 이메일 인증 미완료(도메인 전용, Redis 키 없음)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/BadRequestError"
            examples:
              badRequest:
                summary: 이메일 형식 불일치 / 비밀번호 8~20자 범위 밖
                value: { code: 400_BAD_REQUEST, message: 잘못된 요청입니다. }
              termsNotAgreed:
                summary: 필수 동의 3개 중 미포함 항목 존재(도메인 전용)
                value: { code: 400_TERMS_NOT_AGREED, message: 필수 약관에 모두 동의해 주세요. }
              emailNotVerified:
                summary: 이메일 인증 미완료(도메인 전용)
                value: { code: 400_EMAIL_NOT_VERIFIED, message: 이메일 인증을 먼저 완료해 주세요. }
      "409":
        description: 이미 가입된 이메일(중복 확인 시점 또는 동시 요청으로 저장 시점에 뒤늦게 걸린 경우 모두 포함) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/EmailDuplicatedError"
      "500":
        description: 계정 저장 중 서버 오류
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InternalServerError"

emailVerificationSend:
  post:
    tags: [USR]
    operationId: USR-AUTH-002-SEND
    summary: 이메일 인증번호 발송
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/EmailCodeSendRequest"
    responses:
      "200":
        description: 인증번호 발송 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 이메일 형식 불일치
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/BadRequestError"
      "409":
        description: 이미 가입된 이메일로 인증 요청 — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/EmailDuplicatedError"
      "429":
        description: 5분 이내 재발송 시도(Redis 키가 아직 살아 있음) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/EmailRequestLimitedError"
      "500":
        description: 메일 발송 실패
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InternalServerError"

emailVerificationConfirm:
  post:
    tags: [USR]
    operationId: USR-AUTH-002-VERIFY
    summary: 이메일 인증번호 확인
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/EmailCodeVerifyRequest"
    responses:
      "200":
        description: 인증 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 인증번호 형식 불일치(6자리 숫자가 아님) / 인증번호 불일치(도메인 전용)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/BadRequestError"
            examples:
              badRequest:
                summary: 인증번호 형식 불일치(6자리 숫자가 아님)
                value: { code: 400_BAD_REQUEST, message: 잘못된 요청입니다. }
              codeMismatch:
                summary: 인증번호 불일치(도메인 전용)
                value: { code: 400_EMAIL_CODE_MISMATCH, message: 인증번호가 일치하지 않습니다. }
      "404":
        description: 발급 이력 없이(또는 만료 후) 인증번호 확인 요청 — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/EmailCodeNotFoundError"

login:
  post:
    tags: [USR]
    operationId: USR-AUTH-003
    summary: 로그인
    description: 5회 연속 실패 시 5분 잠금(423 LOCKED)되는 판단을 이 요청 안에서 함께 처리한다([[USR-AUTH-004]] 로직 포함).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/LoginRequest"
    responses:
      "200":
        description: 로그인 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/LoginData"
      "401":
        description: 존재하지 않는 이메일 또는 비밀번호 불일치(구분하지 않음) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/LoginFailedError"
      "423":
        description: 로그인 잠금 중(5회 연속 실패, 5분 잠금) — 도메인 전용
        content:
          application/json:
            schema:
              $ref: "#/schemas/AccountLockedError"
      "500":
        description: 토큰 발급 실패
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/InternalServerError"

tokenRefresh:
  post:
    tags: [USR]
    operationId: USR-AUTH-006
    summary: Access Token 재발급
    description: Refresh Token Rotation 미적용 — Refresh Token은 교체되지 않고 그대로 유지된다.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/TokenRefreshRequest"
    responses:
      "200":
        description: Access Token 재발급 완료
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/TokenRefreshData"
      "401":
        description: Refresh Token 없음 / 서명 불일치 또는 만료 / Redis에 저장된 토큰과 불일치(로그아웃된 토큰)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/UnauthorizedError"

logout:
  post:
    tags: [USR]
    operationId: USR-AUTH-007
    summary: 로그아웃
    responses:
      "200":
        description: 로그아웃 처리 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "401":
        description: 로그인하지 않은 상태로 접근
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/UnauthorizedError"

schemas:
  SignupRequest:
    type: object
    required: [email, password, agreements]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      password:
        type: string
        minLength: 8
        maxLength: 20
        example: Password1!
      agreements:
        type: array
        items:
          type: string
          enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, USAGE_PRINCIPLES]
        example: [TERMS_OF_SERVICE, PRIVACY_POLICY, USAGE_PRINCIPLES]

  EmailCodeSendRequest:
    type: object
    required: [email]
    properties:
      email:
        type: string
        format: email
        example: user@example.com

  EmailCodeVerifyRequest:
    type: object
    required: [email, code]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      code:
        type: string
        pattern: "^[0-9]{6}$"
        example: "123456"

  LoginRequest:
    type: object
    required: [email, password]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      password:
        type: string
        example: Password1!

  LoginData:
    type: object
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      isOnboardingCompleted:
        type: boolean

  TokenRefreshRequest:
    type: object
    required: [refreshToken]
    properties:
      refreshToken:
        type: string

  TokenRefreshData:
    type: object
    properties:
      accessToken:
        type: string

  EmailDuplicatedError:
    type: object
    properties:
      code:
        type: string
        example: 409_EMAIL_DUPLICATED
      message:
        type: string
        example: 이미 가입된 이메일입니다.

  EmailRequestLimitedError:
    type: object
    properties:
      code:
        type: string
        example: 429_EMAIL_REQUEST_LIMITED
      message:
        type: string
        example: 인증 요청이 너무 많아요. 5분 뒤에 다시 시도해 주세요.

  EmailCodeNotFoundError:
    type: object
    properties:
      code:
        type: string
        example: 404_EMAIL_CODE_NOT_FOUND
      message:
        type: string
        example: 인증번호가 만료되었거나 요청 이력이 없습니다. 다시 요청해 주세요.

  LoginFailedError:
    type: object
    properties:
      code:
        type: string
        example: 401_LOGIN_FAILED
      message:
        type: string
        example: 이메일 또는 비밀번호가 올바르지 않습니다.

  AccountLockedError:
    type: object
    properties:
      code:
        type: string
        example: 423_ACCOUNT_LOCKED
      message:
        type: string
        example: 로그인에 5번 실패해 5분 동안 로그인할 수 없어요. 잠시 후 다시 시도해 주세요.
