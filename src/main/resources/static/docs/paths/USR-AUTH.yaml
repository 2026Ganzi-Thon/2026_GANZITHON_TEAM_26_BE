signup:
  post:
    tags: [USR]
    operationId: USR-AUTH-001
    summary: 회원가입
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/SignupRequest"
    responses:
      "201":
        description: 회원가입 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 이메일 형식 불일치 / 비밀번호 8~20자 범위 밖 / 필수 동의 3개 중 미포함 항목 존재 / 이메일 인증 미완료(Redis 키 없음)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "409":
        description: 이미 가입된 이메일(중복 확인 시점 또는 동시 요청으로 저장 시점에 뒤늦게 걸린 경우 모두 포함)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "500":
        description: 계정 저장 중 서버 오류
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

emailVerificationSend:
  post:
    tags: [USR]
    operationId: USR-AUTH-002-SEND
    summary: 이메일 인증번호 발송
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/EmailCodeSendRequest"
    responses:
      "200":
        description: 인증번호 발송 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 이메일 형식 불일치
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "409":
        description: 이미 가입된 이메일로 인증 요청
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "429":
        description: 5분 이내 재발송 시도(Redis 키가 아직 살아 있음)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "500":
        description: 메일 발송 실패
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

emailVerificationConfirm:
  post:
    tags: [USR]
    operationId: USR-AUTH-002-VERIFY
    summary: 이메일 인증번호 확인
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/EmailCodeVerifyRequest"
    responses:
      "200":
        description: 인증 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "400":
        description: 인증번호 형식 불일치(6자리 숫자가 아님) / 인증번호 불일치
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "404":
        description: 발급 이력 없이(또는 만료 후) 인증번호 확인 요청
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

login:
  post:
    tags: [USR]
    operationId: USR-AUTH-003
    summary: 로그인
    description: 5회 연속 실패 시 5분 잠금(423 LOCKED)되는 판단을 이 요청 안에서 함께 처리한다([[USR-AUTH-004]] 로직 포함).
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/LoginRequest"
    responses:
      "200":
        description: 로그인 성공
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/LoginData"
      "401":
        description: 존재하지 않는 이메일 또는 비밀번호 불일치(구분하지 않음)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "423":
        description: 로그인 잠금 중(5회 연속 실패, 5분 잠금)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"
      "500":
        description: 토큰 발급 실패
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

tokenRefresh:
  post:
    tags: [USR]
    operationId: USR-AUTH-006
    summary: Access Token 재발급
    description: Refresh Token Rotation 미적용 — Refresh Token은 교체되지 않고 그대로 유지된다.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/schemas/TokenRefreshRequest"
    responses:
      "200":
        description: Access Token 재발급 완료
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/common.yaml#/SuccessWrapper"
                - type: object
                  properties:
                    data:
                      $ref: "#/schemas/TokenRefreshData"
      "401":
        description: Refresh Token 없음 / 서명 불일치 또는 만료 / Redis에 저장된 토큰과 불일치(로그아웃된 토큰)
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

logout:
  post:
    tags: [USR]
    operationId: USR-AUTH-007
    summary: 로그아웃
    responses:
      "200":
        description: 로그아웃 처리 완료
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/SuccessNoData"
      "401":
        description: 로그인하지 않은 상태로 접근
        content:
          application/json:
            schema:
              $ref: "../components/common.yaml#/Error"

schemas:
  SignupRequest:
    type: object
    required: [email, password, agreements]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      password:
        type: string
        minLength: 8
        maxLength: 20
        example: Password1!
      agreements:
        type: array
        items:
          type: string
          enum: [TERMS_OF_SERVICE, PRIVACY_POLICY, USAGE_PRINCIPLES]
        example: [TERMS_OF_SERVICE, PRIVACY_POLICY, USAGE_PRINCIPLES]

  EmailCodeSendRequest:
    type: object
    required: [email]
    properties:
      email:
        type: string
        format: email
        example: user@example.com

  EmailCodeVerifyRequest:
    type: object
    required: [email, code]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      code:
        type: string
        pattern: "^[0-9]{6}$"
        example: "123456"

  LoginRequest:
    type: object
    required: [email, password]
    properties:
      email:
        type: string
        format: email
        example: user@example.com
      password:
        type: string
        example: Password1!

  LoginData:
    type: object
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
      isOnboardingCompleted:
        type: boolean

  TokenRefreshRequest:
    type: object
    required: [refreshToken]
    properties:
      refreshToken:
        type: string

  TokenRefreshData:
    type: object
    properties:
      accessToken:
        type: string
