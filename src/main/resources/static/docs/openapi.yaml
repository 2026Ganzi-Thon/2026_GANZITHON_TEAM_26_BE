# 한 올 API 명세 (설계용)
# - 이 파일에 API를 먼저 설계하고, 코드를 구현한다.
# - 서버 실행 후 /swagger-ui.html 상단 드롭다운 "1. API 명세 (설계용 YAML)"에서 확인한다.
# - 코드와 명세가 어긋나면 이 파일이 기준이다. 코드를 고친다.
# - 새 도메인 추가 시: paths에 경로 추가 → components/schemas에 응답 스키마 추가
openapi: 3.0.3
info:
  title: 한 올 API
  description: 2026 간지톤 26팀 백엔드 API 설계 문서
  version: v1
servers:
  - url: http://localhost:8080
    description: 로컬
  - url: https://{서버주소}
    description: 개발 서버
tags:
  - name: USR
    description: 유저, 인증
  - name: CRD
    description: 마음 기록, 감정 카드
  - name: BLK
    description: 한 올 보내기/받기, 담요
  - name: ITR
    description: 온기 지도, 함께 쉬는 방
  - name: ALRT
    description: 도움 요청
security:
  - bearerAuth: []

# ================================================================
# paths 작성 규칙
# - 경로: /api/v1/{복수형 리소스}
# - operationId: 기능 ID 그대로 (예: USR-AUTH-001)
# - security: 인증 불필요 시 security: [] 명시
# - 성공 응답은 200/201만 명세한다. 에러 응답은 아래 공통 스키마 참고.
# ================================================================
paths:
  # 예시 — 실제 작업 시 이 블록을 복사해서 사용
  /api/v1/auth/signup:
    post:
      tags: [USR]
      operationId: USR-AUTH-003
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 20
                  example: Password1!
      responses:
        "200":
          description: 회원가입 완료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessNoData"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ================================================================
    # 공통 응답 스키마
    # ================================================================

    # 성공 (데이터 없음): ApiResponse.ok()
    # {"message": "success"}
    SuccessNoData:
      type: object
      properties:
        message:
          type: string
          example: success

    # 성공 (데이터 있음): ApiResponse.ok(data)
    # {"message": "success", "data": {...}}
    # 사용법: allOf로 조합
    # schema:
    #   allOf:
    #     - $ref: "#/components/schemas/SuccessWrapper"
    #     - type: object
    #       properties:
    #         data:
    #           $ref: "#/components/schemas/YourDataSchema"
    SuccessWrapper:
      type: object
      properties:
        message:
          type: string
          example: success
        data:
          type: object

    # 에러 응답: BusinessException → GlobalExceptionHandler
    # {"code": "ERROR_CODE", "message": "에러 메시지"}
    Error:
      type: object
      properties:
        code:
          type: string
          example: INVALID_INPUT
        message:
          type: string
          example: 요청값이 올바르지 않습니다.

    # ================================================================
    # 도메인별 응답 스키마 — 아래에 추가
    # ================================================================

    # 예시
    # TokenResponse:
    #   type: object
    #   properties:
    #     accessToken:
    #       type: string