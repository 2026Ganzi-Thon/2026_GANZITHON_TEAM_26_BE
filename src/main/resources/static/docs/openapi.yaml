# 한 올 API 명세 (설계용)
# 이 파일에 API 를 먼저 설계하고, 서버 실행 후 /swagger-ui.html 상단 드롭다운 "1. API 명세"에서 확인한다.
# 프론트와 합의한 명세의 원본은 이 파일이다. 노션에 따로 옮기지 않는다.
openapi: 3.0.3
info:
  title: 한 올 API 명세
  description: 2026 간지톤 26팀 '한 올' API 설계 문서
  version: v1
servers:
  - url: http://localhost:8080
    description: 로컬
tags:
  - name: USR
    description: 유저, 인증
  - name: CRD
    description: 마음 기록, 감정 카드
  - name: BLK
    description: 한 올 보내기/받기, 담요
  - name: ITR
    description: 온기 지도, 함께 쉬는 방
  - name: ALRT
    description: 도움 요청
security:
  - bearerAuth: []
paths: {}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      description: 모든 API 의 공통 응답 형식
      properties:
        success:
          type: boolean
          example: true
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: 요청에 성공했습니다.
        data:
          description: 실제 응답 데이터 (실패 시 생략되거나 검증 오류 목록)
