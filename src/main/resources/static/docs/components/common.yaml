SuccessNoData:
  type: object
  properties:
    message:
      type: string
      example: success

SuccessWrapper:
  type: object
  properties:
    message:
      type: string
      example: success
    data:
      type: object

BadRequestError:
  type: object
  properties:
    code:
      type: string
      example: 400_BAD_REQUEST
    message:
      type: string
      example: 잘못된 요청입니다.

UnauthorizedError:
  type: object
  properties:
    code:
      type: string
      example: 401_UNAUTHORIZED
    message:
      type: string
      example: 로그인이 필요합니다.

ForbiddenError:
  type: object
  properties:
    code:
      type: string
      example: 403_FORBIDDEN
    message:
      type: string
      example: 접근 권한이 없습니다.

NotFoundError:
  type: object
  properties:
    code:
      type: string
      example: 404_NOT_FOUND
    message:
      type: string
      example: 요청한 리소스를 찾을 수 없습니다.

ConflictError:
  type: object
  properties:
    code:
      type: string
      example: 409_CONFLICT
    message:
      type: string
      example: 이미 처리된 요청입니다.

LockedError:
  type: object
  properties:
    code:
      type: string
      example: 423_LOCKED
    message:
      type: string
      example: 잠금 상태입니다.

TooManyRequestsError:
  type: object
  properties:
    code:
      type: string
      example: 429_TOO_MANY_REQUESTS
    message:
      type: string
      example: 요청이 너무 많습니다.

MethodNotAllowedError:
  type: object
  properties:
    code:
      type: string
      example: 405_METHOD_NOT_ALLOWED
    message:
      type: string
      example: 지원하지 않는 HTTP 메서드입니다.

InternalServerError:
  type: object
  properties:
    code:
      type: string
      example: 500_INTERNAL_SERVER_ERROR
    message:
      type: string
      example: 서버 내부 오류가 발생했습니다.
